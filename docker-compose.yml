version: "3.9"

services:
  app:
    build: .
    container_name: tatito-finance-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATA_STORE_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tatito_finance
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_32_plus_char_production_secret_key
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tatito-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tatito_finance
    ports:
      - "5432:5432"
    volumes:
      - tatito_pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tatito_finance"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tatito-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  tatito_pg_data:
